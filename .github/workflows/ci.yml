name: .NET CI

on:
push:

pull_request:
branches:
- main

jobs:
build-and-test:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Setup .NET
    uses: actions/setup-dotnet@v4
    with:
      dotnet-version: '8.0.x'

  - name: Restore dependencies
    working-directory: src
    run: dotnet restore PersonalFinance.sln

  - name: Build solution
    working-directory: src
    run: dotnet build PersonalFinance.sln --configuration Release --no-restore

  - name: Run tests
    working-directory: src
    run: dotnet test PersonalFinance.sln --configuration Release --no-build

  - name: Build Docker image
    working-directory: src
    run: |
      docker build \
        --tag personalfinance-api:ci \
        --file PersonalFinance.Api/Dockerfile \
        .

