name: .NET CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
    - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ernestocardenas79/personalfinance-api

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        working-directory: src
        run: dotnet restore PersonalFinance.sln

      - name: Build solution
        working-directory: src
        run: dotnet build PersonalFinance.sln --configuration Release --no-restore

      - name: Run tests
        working-directory: src
        run: dotnet test PersonalFinance.sln --configuration Release --no-build

      - name: Build Docker image
        working-directory: src
        run: |
          docker build \
            --tag personalfinance-api:ci \
            --file PersonalFinance.Api/Dockerfile \
            .

  publish-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./src
          file: ./src/PersonalFinance.Api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev