name: .NET CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
    - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ernestocardenas79/personalfinance-api

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        working-directory: src
        run: dotnet restore PersonalFinance.sln

      - name: Build solution
        working-directory: src
        run: dotnet build PersonalFinance.sln --configuration Release --no-restore

      - name: Run tests
        working-directory: src
        run: dotnet test PersonalFinance.sln --configuration Release --no-build

      - name: Build Docker image
        working-directory: src
        run: |
          docker build \
            --tag personalfinance-api:ci \
            --file PersonalFinance.Api/Dockerfile \
            .

  publish-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./src
          file: ./src/PersonalFinance.Api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev

  notify-deployment:
    needs: publish-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Notify deployment repository
        env:
          GH_TOKEN: ${{ secrets.DEPLOYMENT_DISPATCH_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url https://api.github.com/repos/ernestocardenas79/PersonalFinance-deployment/dispatches \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data '{
              "event_type": "application-published",
              "client_payload": {
                "tag": "sha-${{ github.sha }}",
                "commit": "${{ github.sha }}",
                "environment": "dev"
              }
            }'

      - name: Confirm dispatch sent
        run: echo "Deployment event sent successfully."





            
